name: Hourly rebuild

# FR-5/FR-12: the site is static, so news freshness comes from scheduled
# rebuilds. This workflow asks the Cloudflare Pages project (Git integration)
# to rebuild production every hour; the build itself pulls fresh Discussions
# and Releases data. A manual dispatch is provided for "right now".
#
# Required repository secrets (see docs/DEPLOYMENT.md):
#   CF_ACCOUNT_ID   — the Cloudflare account holding the Pages project
#   CF_API_TOKEN    — a token with "Cloudflare Pages: Edit" permission
#   PAGES_PROJECT   — variable, not secret: the Pages project name

on:
  schedule:
    # Hourly at :07 — off the top of the hour to be polite to the API.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-pages-rebuild:
    name: Trigger Cloudflare Pages production build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build via Cloudflare API
        if: ${{ vars.PAGES_PROJECT != '' && secrets.CF_ACCOUNT_ID != '' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch": "main"}')
          echo "$response"
          echo "$response" | grep -q '"success":true'
      - name: Skip (secrets not configured yet)
        if: ${{ !(vars.PAGES_PROJECT != '' && secrets.CF_ACCOUNT_ID != '') }}
        run: |
          echo "CF_ACCOUNT_ID / PAGES_PROJECT not configured — skipping rebuild trigger."
          echo "See docs/DEPLOYMENT.md for the one-time setup."
