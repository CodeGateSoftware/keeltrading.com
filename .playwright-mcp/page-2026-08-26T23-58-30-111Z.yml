        - generic [ref=e124]:
          - paragraph [ref=e125]: "The single source for the console’s vocabulary. Every term a keel screen can show is defined HERE and nowhere else: the TUI’s Help menu renders this file directly (bounded read, cached by mtime — the same reader discipline the Research corpus keeps), and the docs link to it rather than restating a definition that could drift."
          - paragraph [ref=e126]:
            - text: Two honesty rules this file inherits from
            - code [ref=e127]: docs/fiqh-basis.md
            - text: ":"
          - list [ref=e128]:
            - listitem [ref=e129]:
              - strong [ref=e130]: Fiqh terms are anchored, never authored.
              - text: A fiqh term’s definition is a verbatim passage of
              - code [ref=e131]: docs/fiqh-basis.md
              - text: ", and its"
              - code [ref=e132]: "Source:"
              - text: line names the document and the exact section it was quoted from. Where fiqh-basis does not state a term (gharar), the definition says so, rather than papering the gap with a paraphrase that sounds like a ruling — the knowledge-base sources fiqh-basis indexes are the place to read it.
            - listitem [ref=e133]:
              - strong [ref=e134]: Rule parameters are not defined here.
              - text: What
              - code [ref=e135]: turtle_breakout
              - text: ’s
              - code [ref=e136]: entry_lookback
              - text: means lives in the rule class that defines it, rendered by introspection through
              - code [ref=e137]: keel.commands.rules.describe_params
              - text: — the help system LINKS to that source; a second table in this file would drift the day a class changed. The entries below define only the vocabulary shared across screens.
          - paragraph [ref=e138]:
            - text: Each entry is a
            - code [ref=e139]: "## term"
            - text: heading, a definition, and a
            - code [ref=e140]: "Source:"
            - text: line.
          - heading "rail" [level=2] [ref=e141]
          - paragraph [ref=e142]: One of keel’s numbered hard guards that every order passes through — spend caps, drawdown breakers, the allowlist, settlement-currency and spot-shape checks. Eighteen exist (1-14, 16, 17, 18, 19 — there is no rail 15); each is un-overridable and audit-logged.
          - paragraph [ref=e143]: "Source: keel’s own vocabulary — docs/fiqh-basis.md’s rails table (the prudential rails 2-14, 16) plus its prose sections for rails 1, 17, 18 and 19"
          - heading "attestation" [level=2] [ref=e144]
          - paragraph [ref=e145]:
            - text: market facts are computed, Shariah classifications are
            - strong [ref=e146]: ATTESTED, never inferred
            - text: . Whether a token’s core purpose is a haram sector (§28.4), whether it is asset-backed
            - code [ref=e147]: "'ayn"
            - text: or a claim
            - code [ref=e148]: dayn
            - text: (§65.5/§67.2), and whether it pays a riba-like yield are questions of fact-plus-scholarship about the world. No module in this repository derives them from candles, and none pretends to. A human records them, with a source and a name, via
            - code [ref=e149]: keel assets attest
            - text: .
          - paragraph [ref=e150]: "Source: docs/fiqh-basis.md — ”## What is attested versus what is computed”"
          - heading "instrument attestation" [level=2] [ref=e151]
          - paragraph [ref=e152]:
            - text: Only
            - code [ref=e153]: spot
            - text: is admitted; CFD, future, perpetual, option, and leveraged-token listings are refused, recorded via
            - code [ref=e154]: keel assets attest-instrument
            - text: . Unattested fails closed.
          - paragraph [ref=e155]:
            - text: "Source: docs/fiqh-basis.md — ”### The curation screen ("
            - code [ref=e156]: keel/compliance/screen.py
            - text: )”
          - heading "exemption" [level=2] [ref=e157]
