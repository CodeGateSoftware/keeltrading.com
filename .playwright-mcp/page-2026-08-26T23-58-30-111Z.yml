          - heading "maisir" [level=2] [ref=e199]
          - paragraph [ref=e200]:
            - text: what makes speculation
            - emphasis [ref=e201]: maisir
            - text: is non-ownership, non-delivery, difference-settlement
          - paragraph [ref=e202]: "Source: docs/fiqh-basis.md — ”### Rails 18/19 — settlement currency and spot-instrument shape”"
          - heading "purification" [level=2] [ref=e203]
          - paragraph [ref=e204]: interest/reward credits are segregated from realised P&L and the equity base, reported as owed to charity, never recognised as profit
          - paragraph [ref=e205]: "Source: docs/fiqh-basis.md — ”### Purification (§65.9) and idle-balance rewards (§56.3)”"
          - heading "session-bound venue" [level=2] [ref=e206]
          - paragraph [ref=e207]:
            - text: "A market with opening hours (equities): it closes for nights, weekends and holidays, and its adapter declares"
            - code [ref=e208]: session_bound
            - text: so the engine consults the venue’s own clock before trading. Crypto venues are the 24/7 contrast — always open, no clock to consult.
          - paragraph [ref=e209]:
            - text: "Source: keel’s own vocabulary — the adapters’"
            - code [ref=e210]: session_bound
            - text: capability declaration
          - heading "market clock" [level=2] [ref=e211]
          - paragraph [ref=e212]:
            - text: The venue’s OWN clock read (
            - code [ref=e213]: /v2/clock
            - text: on Alpaca; a constant OPEN on 24/7 venues) — never a locally maintained calendar, which would drift from the venue on holidays and half-days.
          - paragraph [ref=e214]:
            - text: "Source: keel’s own vocabulary — the broker port’s"
            - code [ref=e215]: market_clock()
          - heading "trust window" [level=2] [ref=e216]
          - paragraph [ref=e217]:
            - text: The interval a recorded market-clock state vouches for. Outside it the record is stale and every surface renders CLOCK UNAVAILABLE, fail-loud — exactly how
            - code [ref=e218]: fetch --check
            - text: treats a record that no longer vouches for anything.
          - paragraph [ref=e219]: "Source: keel’s own vocabulary — keel.agent’s recorded session state"
          - heading "DCA benchmark" [level=2] [ref=e220]
          - paragraph [ref=e221]: "The honest alternative every simulated strategy is measured against: dollar-cost-average buying of the same products over the same window. A strategy that cannot beat it has no reason to exist."
          - paragraph [ref=e222]: "Source: keel’s own vocabulary — keel/commands/simulate.py"
          - heading "granularity" [level=2] [ref=e223]
          - paragraph [ref=e224]:
            - text: "The candle bar size a rule runs on (one hour, one day, …). It is a rule PARAMETER: each kind’s choices, default and meaning render from the rule class itself through"
            - code [ref=e225]: keel commands.rules.describe_params
            - text: — this glossary does not restate them.
          - paragraph [ref=e226]: "Source: keel’s own vocabulary — the rule classes via describe_params"
          - heading "trials ledger" [level=2] [ref=e227]
