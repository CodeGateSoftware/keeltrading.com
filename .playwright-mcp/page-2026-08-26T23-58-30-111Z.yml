            - text: )”
          - heading "screening" [level=2] [ref=e163]
          - paragraph [ref=e164]: An unattested asset is not “probably fine” — it is unknown, and the screen fails closed on unknown.
          - paragraph [ref=e165]: "Source: docs/fiqh-basis.md — ”## What is attested versus what is computed”"
          - heading "promotion gate" [level=2] [ref=e166]
          - paragraph [ref=e167]:
            - text: The thresholds a candidate rule must clear on out-of-sample evidence before
            - code [ref=e168]: rules promote
            - text: "moves it toward live: the lookahead gate first (truncation-diff analysis must find the rule clean of future-reading before anything else is even measured), then the four performance floors — min_trades (a minimum number of trades), min_expectancy, min_rr (a minimum realised reward:risk ratio) and min_win_rate — AND the overfitting gate (G4): a probability of backtest overfitting (PBO) above its bound TOGETHER WITH a steeply negative degradation slope, a conjunction, not a bare PBO bound. Pooling is per parameter SET and covers only the sample-size axis — the same parameter set’s paper evidence may count toward min_trades across products — and the G4/overfitting gate is NOT pooled. A pooled count is not a count of independent observations: the signals herd (about 8 products fire the same UTC day) and the outcomes correlate (ICC 0.212), so n pooled trades carry n / DEFF ~ n / 2.58 EFFECTIVE observations — n = 100 pooled is n_eff ~ 39, an edge of 20 points or more (#427; keel/research/throughput.py, pinned by tests/research/test_throughput.py). The DCA benchmark is not a floor of this gate; a simulate report is where a rule is measured against it."
            - code [ref=e169]: keel insights
            - text: renders how far a rule sits from the gate.
          - paragraph [ref=e170]: "Source: keel’s own vocabulary — keel/strategy/promotion.py and keel/research/cscv.py"
          - heading "paper mode" [level=2] [ref=e171]
          - paragraph [ref=e172]: "Simulated execution against real prices: paper buys spend a paper cash balance, no order ever reaches a venue, and every fill is synthetic. keel’s paper deployments are separate config+db pairs from live — no figure on one describes the other."
          - paragraph [ref=e173]: "Source: keel’s own vocabulary — the wrappers and docs/operator-runbook.md"
          - heading "live mode" [level=2] [ref=e174]
          - paragraph [ref=e175]: "Real orders at a real venue. Live selection is guarded: choosing the live deployment in the console asks an explicit y/N, and the engine’s confirm mode gates every order behind an interactive confirmation."
          - paragraph [ref=e176]: "Source: keel’s own vocabulary — the wrappers and docs/operator-runbook.md"
          - heading "kill switch" [level=2] [ref=e177]
          - paragraph [ref=e178]:
            - text: A stored halt that stops all trading immediately (
            - code [ref=e179]: keel kill
            - text: — one command, always allowed, logged). Releasing it (
            - code [ref=e180]: keel resume
            - text: ) is deliberately harder than engaging it.
          - paragraph [ref=e181]: "Source: keel’s own vocabulary — keel/commands/trading.py"
          - heading "autonomy" [level=2] [ref=e182]
          - paragraph [ref=e183]: The armed state in which the agent places orders unattended. Arming demands a typed yes at the terminal; disarming only ever reduces capability and stays ungated.
          - paragraph [ref=e184]: "Source: keel’s own vocabulary — keel/commands/autonomy.py"
          - heading "qabd" [level=2] [ref=e185]
          - paragraph [ref=e186]: possession is the ability to dispose, not physical custody
          - paragraph [ref=e187]:
            - text: "Source: docs/fiqh-basis.md — ”### Rail 17 — withdrawal capability,"
            - code [ref=e188]: qabd
            - text: §65.4”
          - heading "riba" [level=2] [ref=e189]
          - paragraph [ref=e190]: Coinbase pays USDC rewards on idle balances, that interest is riba, and it accrues with no order placed
          - paragraph [ref=e191]: "Source: docs/fiqh-basis.md — ”### Purification (§65.9) and idle-balance rewards (§56.3)”"
          - heading "gharar" [level=2] [ref=e192]
