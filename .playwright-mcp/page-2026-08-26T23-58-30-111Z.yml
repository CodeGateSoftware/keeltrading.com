          - paragraph [ref=e194]: "Source: docs/fiqh-basis.md — not stated there; see ”## How to read the citations”"
          - heading "maysir" [level=2] [ref=e195]
          - paragraph [ref=e196]:
            - text: The commoner English transliteration of
            - emphasis [ref=e197]: maisir
            - text: — see the maisir entry.
