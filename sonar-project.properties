# SonarCloud project configuration
#
# The i18n dictionaries (src/i18n/**) are deliberately parallel: every locale
# block mirrors the same keys with translated prose (PRD D4/FR-7 — EN is the
# source of truth, AR/FR tracked by revision markers). Duplication analysis
# reads that parallelism as copy-paste; it is the architecture, not debt.
sonar.cpd.exclusions=src/i18n/**
